<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgroVoice — Powered by N-ATLAS</title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#18221d}button{background:#176b46;color:#fff;border:0;border-radius:8px;padding:.7rem 1rem;cursor:pointer}textarea,input,select{width:100%;padding:.7rem;margin:.35rem 0 1rem;border:1px solid #bbc8c0;border-radius:8px}section{border:1px solid #dbe5de;border-radius:12px;padding:1rem;margin:1rem 0}.muted{color:#637166}.result{white-space:pre-wrap;background:#f3f7f4;padding:1rem;border-radius:8px}</style></head>
<body><h1>AgroVoice</h1><p class="muted">Voice-to-action agricultural assistance foundation. Local demo mode is clearly labelled and is not N-ATLAS evidence.</p>
<section><h2>Evaluator demo</h2><label>Language<select id="language"><option value="hausa">Hausa</option><option value="yoruba">Yoruba</option><option value="nigerian_english">Nigerian English</option></select></label><label>Crop<input id="crop" value="tomato"></label><label>Question<textarea id="question">My tomato leaves are yellow and I see insects</textarea></label><button onclick="ask()">Run voice-query pipeline</button><div id="result" class="result" style="margin-top:1rem">No request yet.</div></section>
<section><h2>Evidence console</h2><button onclick="loadMetrics()">Refresh metrics</button><div id="metrics" class="result" style="margin-top:1rem">No metrics loaded.</div></section>
<script>async function ask(){const r=await fetch('/voice/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:language.value,crop:crop.value,audio_text:question.value,consent:true,session_id:'demo-session'})});result.textContent=JSON.stringify(await r.json(),null,2)}async function loadMetrics(){const r=await fetch('/metrics');metrics.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
